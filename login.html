<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="loginTitle">Login - SpeedType</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: #007bff;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        /* Добавляем стили для переключателя языка */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
        }

        .language-switcher label {
            font-size: 12px;
            color: #495057;
            font-weight: 500;
            margin: 0;
        }

        .language-switcher select {
            padding: 4px 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 12px;
            background: white;
            width: auto;
        }

        @media (max-width: 480px) {
            .language-switcher {
                position: static;
                margin-bottom: 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <label for="authLanguageSelect" data-translate="interface">Interface:</label>
        <select id="authLanguageSelect">
            <option value="en" data-translate="english">English</option>
            <option value="ru" data-translate="russian">Russian</option>
        </select>
    </div>

    <div class="auth-container">
        <h1>SpeedType</h1>

        <div class="tab-buttons">
            <button class="tab-button active" onclick="showLogin()" data-translate="login">Login</button>
            <button class="tab-button" onclick="showRegister()" data-translate="register">Register</button>
        </div>

        <div id="message" class="message hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername" data-translate="usernameLabel">Username:</label>
                <input type="text" id="loginUsername" data-translate="usernamePlaceholder" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword" data-translate="passwordLabel">Password:</label>
                <input type="password" id="loginPassword" data-translate="passwordPlaceholder" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn" data-translate="loginButton">Login</button>
        </form>

        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label for="registerUsername" data-translate="usernameLabel">Username:</label>
                <input type="text" id="registerUsername" data-translate="usernamePlaceholder" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="registerPassword" data-translate="passwordLabel">Password:</label>
                <input type="password" id="registerPassword" data-translate="passwordPlaceholder" placeholder="Enter password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword" data-translate="confirmPasswordLabel">Confirm Password:</label>
                <input type="password" id="confirmPassword" data-translate="confirmPasswordPlaceholder" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn" id="registerBtn" data-translate="registerButton">Register</button>
        </form>

        <a href="index.html" class="back-link" data-translate="backToMain">← Back to SpeedType</a>
    </div>

    <script src="localization.js"></script>
    <script>
        // Инициализация локализации
        document.addEventListener('DOMContentLoaded', function() {
            initLocalization();
            setupLanguageSwitcher();
        });

        function setupLanguageSwitcher() {
            const langSelect = document.getElementById('authLanguageSelect');
            langSelect.value = currentLanguage;
            langSelect.addEventListener('change', function() {
                changeInterfaceLanguage(this.value);
                updateButtonTexts(); // Обновляем динамические тексты
            });
        }

        function updateButtonTexts() {
            // Обновляем кнопки в зависимости от их состояния
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            
            if (!loginBtn.disabled) {
                loginBtn.textContent = t('loginButton');
            }
            if (!registerBtn.disabled) {
                registerBtn.textContent = t('registerButton');
            }
        }

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.querySelectorAll('.tab-button')[0].classList.add('active');
            document.querySelectorAll('.tab-button')[1].classList.remove('active');
            hideMessage();
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.querySelectorAll('.tab-button')[0].classList.remove('active');
            document.querySelectorAll('.tab-button')[1].classList.add('active');
            hideMessage();
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = t('loggingIn');

            try {
                console.log('Attempting login for user:', username);

                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                console.log('Login response status:', response.status);

                if (response.ok) {
                    const data = await response.json();
                    console.log('Login successful, received data:', data);

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);

                    console.log('Token saved to localStorage:', data.token.substring(0, 20) + '...');
                    console.log('Username saved to localStorage:', username);

                    showMessage(t('loginSuccess'), 'success');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    const errorText = await response.text();
                    console.error('Login failed:', errorText);
                    showMessage(t('loginError'), 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage(t('connectionError'), 'error');
            }

            loginBtn.disabled = false;
            loginBtn.textContent = t('loginButton');
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');

            if (password !== confirmPassword) {
                showMessage(t('passwordMismatch'), 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = t('registering');

            try {
                console.log('Attempting registration for user:', username);

                const response = await fetch('http://localhost:8080/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                console.log('Registration response status:', response.status);

                if (response.ok) {
                    console.log('Registration successful');
                    showMessage(t('registerSuccess'), 'success');

                    setTimeout(() => {
                        showLogin();
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    const errorText = await response.text();
                    console.error('Registration failed:', errorText);
                    showMessage(t('registerError'), 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showMessage(t('connectionError'), 'error');
            }

            registerBtn.disabled = false;
            registerBtn.textContent = t('registerButton');
        });

        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');

            if (token && username) {
                console.log('User already logged in, redirecting to main page');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
