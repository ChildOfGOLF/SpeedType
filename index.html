<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedType - Typing Speed Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpeedType</h1>
            <div class="auth-section">
                <div id="userPanel" class="user-panel hidden">
                    <span>Welcome, <span id="usernameDisplay"></span>!</span>
                    <button id="myResultsBtn" class="btn btn-secondary">My Results</button>
                    <button id="logoutBtn" class="btn btn-logout">Logout</button>
                </div>

                <div id="guestPanel" class="guest-panel">
                    <button id="loginLinkBtn" class="btn btn-primary">Login / Register</button>
                </div>
            </div>
        </header>

        <main>
            <div class="difficulty-section">
                <label for="difficultySelect">Difficulty:</label>
                <select id="difficultySelect">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="text-display" id="displayText">
                Loading text...
            </div>

            <div class="input-section">
                <textarea id="inputText" placeholder="Type the text above here..." disabled></textarea>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start Test</button>
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <label>Time (s):</label>
                    <span id="timeDisplay">0</span>
                </div>
                <div class="stat">
                    <label>Speed (WPM):</label>
                    <span id="speedDisplay">0</span>
                </div>
                <div class="stat">
                    <label>Errors:</label>
                    <span id="errorDisplay">0</span>
                </div>
            </div>

            <div id="finalResults" class="final-results hidden">
                <h3>Test Complete!</h3>
                <p>Your typing speed: <strong><span id="finalSpeed">0</span> WPM</strong></p>
                <p>Total errors: <strong><span id="finalErrors">0</span></strong></p>
                <button id="retryBtn" class="btn btn-primary">Try Again</button>
            </div>

            <div id="saveStatus" class="save-status hidden"></div>
        </main>
    </div>

    <div id="myResultsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>My Results</h2>
                <span id="closeModal" class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="resultsContainer">
                    <p>Loading your results...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
