# ???????????? ??? PostgreSQL (?????? ???? ??? ???? ????)
server.port=8080

# PostgreSQL ?????????
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/speedtype}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:speedtype_user}
spring.datasource.password=${DATABASE_PASSWORD:password}

# JPA ?????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ????????? ???? ??????????
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ????????????? ??????
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT ?????? (?????????? ?????????? ????????? JWT_SECRET ??? ??????????)
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}

# ???????????
logging.level.org.springframework.security=INFO
logging.level.com.example.speedtype=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
